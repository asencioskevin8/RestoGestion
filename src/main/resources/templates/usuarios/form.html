<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Usuario | RestoGestión</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="bg-light"><main class="container py-4"><div class="card shadow-sm mx-auto" style="max-width:650px"><div class="card-body"><h1 class="h4 mb-4" th:text="${usuario.idUsuario == null ? 'Nuevo usuario' : 'Editar usuario'}">Usuario</h1><form th:action="@{/usuarios/guardar}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="idUsuario" th:value="${usuario.idUsuario}"><label class="form-label">Nombre completo</label><input class="form-control mb-3" name="nombreCompleto" th:value="${usuario.nombreCompleto}" required><label class="form-label">Nombre de usuario</label><input class="form-control mb-3" name="username" th:value="${usuario.username}" required><label class="form-label">Contraseña <small class="text-muted">(dejar vacía para conservarla)</small></label><input class="form-control mb-3" type="password" name="password" minlength="4"><label class="form-label">Rol</label><select class="form-select mb-3" name="rolId" required><option th:each="rol : ${roles}" th:value="${rol.idRol}" th:selected="${usuario.rol != null and usuario.rol.idRol == rol.idRol}" th:text="${rol.nombre}">ROL</option></select><label class="form-label">Estado</label><select class="form-select mb-4" name="estado"><option value="ACTIVO" th:selected="${usuario.estado == 'ACTIVO'}">ACTIVO</option><option value="INACTIVO" th:selected="${usuario.estado == 'INACTIVO'}">INACTIVO</option></select><div class="d-flex justify-content-between"><a class="btn btn-secondary" th:href="@{/usuarios}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar usuario</button></div></form></div></div></main></body></html>
