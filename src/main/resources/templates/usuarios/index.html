<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Usuarios | RestoGestión</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="bg-light"><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3">Gestión de usuarios</h1><p class="text-muted mb-0">Administra accesos, roles y estados.</p></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/}">Panel</a><a class="btn btn-primary" th:href="@{/usuarios/nuevo}">Nuevo usuario</a></div></div>
<div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-dark"><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="usuario : ${usuarios}"><td th:text="${usuario.nombreCompleto}">Usuario</td><td th:text="${usuario.username}">admin</td><td th:text="${usuario.rol.nombre}">ADMINISTRADOR</td><td><span class="badge" th:classappend="${usuario.estado == 'ACTIVO'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${usuario.estado}">ACTIVO</span></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}">Editar</a><form class="d-inline" th:action="@{/usuarios/{id}/estado(id=${usuario.idUsuario})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="estado" th:value="${usuario.estado == 'ACTIVO' ? 'INACTIVO' : 'ACTIVO'}"><button class="btn btn-sm btn-outline-warning" type="submit" th:text="${usuario.estado == 'ACTIVO' ? 'Desactivar' : 'Activar'}">Cambiar</button></form></td></tr></tbody></table></div></div></main></body></html>
