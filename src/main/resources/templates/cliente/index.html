<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menú del cliente | RestoGestión</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="bg-light"><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3">Menú digital</h1><p class="text-muted mb-0">Consulta el menú y registra tu pedido.</p></div><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-danger" type="submit">Salir</button></form></div><div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="card shadow-sm"><div class="card-body"><form th:action="@{/cliente/pedido}" method="post"><label class="form-label">Mesa</label><select class="form-select mb-3" name="numeroMesa" required><option value="">Selecciona tu mesa</option><option th:each="mesa : ${mesas}" th:value="${mesa.numeroMesa}" th:text="${mesa.numeroMesa}">M01</option></select><label class="form-label">Producto</label><select class="form-select mb-3" name="productoId" required><option value="">Selecciona un producto</option><optgroup th:each="categoria : ${categorias}" th:label="${categoria.nombreCategoria}"><option th:each="producto : ${productos}" th:if="${producto.disponible and producto.categoria != null and producto.categoria.idCategoria == categoria.idCategoria}" th:value="${producto.idProducto}" th:text="${producto.nombreProducto + ' - S/ ' + producto.precioUnitario}">Producto</option></optgroup></select><label class="form-label">Cantidad</label><input class="form-control mb-3" type="number" name="cantidad" min="0.01" step="0.01" value="1" required><label class="form-label">Método de pago</label><select class="form-select mb-3" name="metodoPago"><option>EFECTIVO</option><option>TARJETA</option><option>YAPE</option><option>PLIN</option></select><label class="form-label">Observaciones</label><textarea class="form-control mb-3" name="observaciones" maxlength="255"></textarea><button class="btn btn-primary" type="submit">Enviar pedido</button></form></div></div></main></body></html>
