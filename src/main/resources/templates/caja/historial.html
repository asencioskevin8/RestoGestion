<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{caja/fragments :: head('Historial de caja')}"></head>
<body>
<div class="app">
  <aside th:replace="~{caja/fragments :: sidebar('historial')}"></aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb">Caja <span style="padding:0 7px;color:#b2bbb5">/</span> <strong>Historial</strong></div>
    </header>
    <main>
      <div class="page-head">
        <div>
          <div class="eyebrow">Registro de turnos</div>
          <h1>Historial de sesiones de caja</h1>
          <p class="subhead">Aperturas, cierres y descuadres registrados en MySQL.</p>
        </div>
        <a class="button link-button" th:href="@{/caja}">← Volver a caja</a>
      </div>

      <div th:replace="~{caja/fragments :: alertas}"></div>

      <section class="panel">
        <div style="overflow:auto">
          <table class="inventory-table">
            <thead>
              <tr><th>#</th><th>Cajero</th><th>Apertura</th><th>Cierre</th><th class="num">Inicial</th><th class="num">Ventas</th><th class="num">Conteo físico</th><th class="num">Descuadre</th><th>Estado</th></tr>
            </thead>
            <tbody>
              <tr th:each="s : ${sesiones}">
                <td th:text="${s.idSesion}">1</td>
                <td th:text="${s.usuarioCajero.nombreCompleto}">Cajero</td>
                <td th:text="${#temporals.format(s.fechaApertura, 'dd/MM/yyyy HH:mm')}">-</td>
                <td th:text="${s.fechaCierre != null} ? ${#temporals.format(s.fechaCierre, 'dd/MM/yyyy HH:mm')} : '—'">—</td>
                <td class="num" th:text="${#numbers.formatDecimal(s.montoInicial, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                <td class="num" th:text="${#numbers.formatDecimal(s.totalVentas, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                <td class="num" th:text="${s.saldoFinalFisico != null} ? ${#numbers.formatDecimal(s.saldoFinalFisico, 1, 'COMMA', 2, 'POINT')} : '—'">—</td>
                <td class="num" th:if="${s.descuadre != null}">
                  <span class="badge" th:classappend="${s.descuadre.signum() == 0} ? 'green' : (${s.descuadre.signum() > 0} ? 'gold' : 'red')"
                        th:text="${#numbers.formatDecimal(s.descuadre, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                </td>
                <td class="num" th:if="${s.descuadre == null}">—</td>
                <td><span class="badge" th:classappend="${s.estado == 'ABIERTA'} ? 'green' : 'blue'" th:text="${s.estado}">ABIERTA</span></td>
              </tr>
              <tr th:if="${#lists.isEmpty(sesiones)}"><td colspan="9" class="empty">Aún no hay sesiones de caja registradas.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>
</body>
</html>
