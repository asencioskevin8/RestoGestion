<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva comanda | RestoGestión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<main class="container py-4"><div class="card shadow-sm mx-auto" style="max-width:650px"><div class="card-body">
  <h1 class="h4">Registrar comanda</h1><p class="text-muted">Agrega los productos solicitados por los clientes de esta mesa.</p>
  <form th:action="@{/pedidos/guardar}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label class="form-label">Mesa seleccionada</label>
    <input type="hidden" name="numeroMesa" th:value="${mesaSeleccionada.numeroMesa}">
    <div class="form-control mb-3 bg-light fw-semibold" th:text="${mesaSeleccionada.numeroMesa + ' - ' + mesaSeleccionada.estado}">M01 - OCUPADA</div>
    <div class="d-flex justify-content-between align-items-center mb-2">
      <label class="form-label mb-0">Productos de la comanda</label>
      <button class="btn btn-outline-primary btn-sm" type="button" id="agregar-producto"><i class="bi bi-plus-circle me-1"></i>Agregar producto</button>
    </div>
    <div id="items-comanda">
      <div class="item-comanda border rounded p-3 mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-6">
            <label class="form-label small">Producto por categoría</label>
            <select class="form-select" name="productoId" required>
              <option value="">Selecciona un producto</option>
              <optgroup th:each="categoria : ${categorias}" th:label="${categoria.nombreCategoria}">
                <option th:each="producto : ${productos}"
                        th:if="${producto.disponible and producto.categoria != null and producto.categoria.idCategoria == categoria.idCategoria}"
                        th:value="${producto.idProducto}"
                        th:text="${producto.nombreProducto + ' - S/ ' + producto.precioUnitario}">Producto</option>
              </optgroup>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small">Cantidad</label>
            <input class="form-control" type="number" name="cantidad" min="0.01" step="0.01" value="1" required>
          </div>
          <div class="col-md-3">
            <label class="form-label small">Nota</label>
            <input class="form-control" type="text" name="notas" maxlength="255" placeholder="Ej. sin cebolla">
          </div>
          <div class="col-md-1 d-grid">
            <button class="btn btn-outline-danger quitar-producto" type="button" title="Quitar producto" disabled><i class="bi bi-trash"></i></button>
          </div>
        </div>
      </div>
    </div>
    <label class="form-label">Observaciones generales</label><textarea class="form-control mb-3" name="observaciones" maxlength="255"></textarea>
    <div class="d-flex justify-content-between"><a class="btn btn-secondary" th:href="@{/mesas}">Cancelar</a><button class="btn btn-primary" type="submit"><i class="bi bi-send me-1"></i>Enviar comanda a cocina</button></div>
  </form>
</div></div></main>
<script>
  const contenedor = document.getElementById('items-comanda');
  const botonAgregar = document.getElementById('agregar-producto');

  function actualizarBotonesQuitar() {
    const filas = [...contenedor.querySelectorAll('.item-comanda')];
    filas.forEach(fila => fila.querySelector('.quitar-producto').disabled = filas.length === 1);
  }

  botonAgregar.addEventListener('click', () => {
    const fila = contenedor.querySelector('.item-comanda').cloneNode(true);
    fila.querySelector('select').value = '';
    fila.querySelector('input[name="cantidad"]').value = '1';
    fila.querySelector('input[name="notas"]').value = '';
    contenedor.appendChild(fila);
    actualizarBotonesQuitar();
  });

  contenedor.addEventListener('click', event => {
    const boton = event.target.closest('.quitar-producto');
    if (boton) {
      boton.closest('.item-comanda').remove();
      actualizarBotonesQuitar();
    }
  });
</script>
</body>
</html>
