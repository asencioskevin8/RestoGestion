<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | RestoGestión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh">
  <main class="container"><div class="row justify-content-center"><div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0"><div class="card-body p-4">
      <div class="text-center mb-4"><h1 class="h3 mb-1">RestoGestión</h1><p class="text-muted mb-0">Inicia sesión para continuar</p></div>
      <div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
      <div class="alert alert-success" th:if="${param.logout}">Sesión cerrada correctamente.</div>
      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label class="form-label">Usuario</label><input class="form-control mb-3" type="text" name="username" autocomplete="username" required autofocus>
        <label class="form-label">Contraseña</label><input class="form-control mb-4" type="password" name="password" autocomplete="current-password" required>
        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
      </form>
      <p class="text-muted small mt-3 mb-0">Acceso de presentación: cualquier usuario / 1234</p>
    </div></div>
  </div></div></main>
</body>
</html>
