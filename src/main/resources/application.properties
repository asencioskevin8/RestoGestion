spring.application.name=RestoGestion
server.port=${PORT:8080}
spring.thymeleaf.cache=false

# ==========================================================
# Configuración de Conexión a Base de Datos MySQL
# ==========================================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:restogestion}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}

# ==========================================================
# JPA / Hibernate
# ==========================================================
# 'update' mantiene el esquema sincronizado con las entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Inicialización diferida de fuentes de datos
spring.jpa.defer-datasource-initialization=true

# JWT para la API REST. En un entorno real debe configurarse mediante JWT_SECRET.
app.jwt.secret=${JWT_SECRET:UmVzdG9HZXN0aW9uLWRldmVsb3BtZW50LXNlY3JldC1rZXktMjAyNi1wcmVzZW50YWNpb24=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Validación de clientes DNI/RUC.
# Configurar IDENTITY_API_TOKEN como variable de entorno; no subir el token a Git.
app.identity-api.base-url=${IDENTITY_API_BASE_URL:}
app.identity-api.token=${IDENTITY_API_TOKEN:}
