spring.application.name=RestoGestion
server.port=8080
spring.thymeleaf.cache=false

# ==========================================================
# Configuración de Conexión a Base de Datos MySQL
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/restogestion?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root

# ==========================================================
# JPA / Hibernate
# ==========================================================
# 'update' mantiene el esquema sincronizado con las entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización diferida de fuentes de datos
spring.jpa.defer-datasource-initialization=true
