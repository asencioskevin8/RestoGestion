spring.application.name=RestoGestion
server.port=8080
spring.thymeleaf.cache=false

# ==========================================================
# Configuración de Conexión a Base de Datos MySQL
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/restogestion?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root

# ==========================================================
# JPA / Hibernate
# ==========================================================
# 'update' mantiene el esquema sincronizado con las entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización diferida de fuentes de datos
spring.jpa.defer-datasource-initialization=true

# JWT para la API REST. En un entorno real debe configurarse mediante JWT_SECRET.
app.jwt.secret=${JWT_SECRET:UmVzdG9HZXN0aW9uLWRldmVsb3BtZW50LXNlY3JldC1rZXktMjAyNi1wcmVzZW50YWNpb24=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
